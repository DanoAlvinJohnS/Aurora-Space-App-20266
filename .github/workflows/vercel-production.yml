name: Deploy TeraFlare from Azure SQL to Vercel

# Pushes to main build fresh data before deploying. A manual smoke run
# checks Azure connectivity but cannot deploy sample data.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke = test only; full = build all Azure data and deploy'
        required: true
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: read

concurrency:
  group: teraflare-integrated-production
  cancel-in-progress: false

jobs:
  build-azure-data:
    name: Read Azure SQL and build production dataset
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    environment: azure-data
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SQL_AUTH: cli
      AZURE_SQL_SERVER: rocketeers64
      AZURE_SQL_DATABASE: Teraflare_Data
      BUILD_MODE: ${{ github.event_name == 'push' && 'full' || inputs.mode }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Microsoft ODBC Driver 18
        shell: bash
        run: |
          set -euo pipefail
          if ! odbcinst -q -d 2>/dev/null | grep -Fq '[ODBC Driver 18 for SQL Server]'; then
            curl -fsSLo /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update
            sudo env ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-sql.txt
      - name: Validate preprocessing code
        run: |
          python -m py_compile preprocess.py sql_aggregate.py count_helpers.py run.py
          python -m unittest discover -s tests -v
      - name: Azure login with GitHub OIDC
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Test Azure SQL access (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import struct
          import pyodbc
          from azure.identity import AzureCliCredential
          token = AzureCliCredential().get_token('https://database.windows.net/.default').token.encode('utf-16-le')
          attrs = {1256: struct.pack('<I', len(token)) + token}
          conn = pyodbc.connect(
              'DRIVER={ODBC Driver 18 for SQL Server};'
              'SERVER=tcp:rocketeers64.database.windows.net,1433;'
              'DATABASE=Teraflare_Data;Encrypt=yes;TrustServerCertificate=no;',
              attrs_before=attrs, timeout=30)
          with conn:
              cur = conn.cursor()
              for name in ('firms_modis', 'firms_viirs'):
                  cur.execute(f'SELECT TOP (1) latitude FROM dbo.{name}')
                  if cur.fetchone() is None:
                      raise RuntimeError(f'{name} contains no rows')
                  print(f'Azure SQL read access OK: dbo.{name}')
          PY
      - name: Generate fresh dataset from Azure SQL
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUILD_MODE" == 'smoke' ]]; then
            echo 'Smoke mode: sampled data is test-only and will NOT deploy.'
            python preprocess.py --source sql --tables dbo.firms_modis,dbo.firms_viirs --sql-aggregate --sql-sample-percent 0.01
          elif [[ "$BUILD_MODE" == 'full' ]]; then
            echo 'Full mode: SQL-side aggregation across the entire Azure dataset.'
            python preprocess.py --source sql --tables dbo.firms_modis,dbo.firms_viirs --sql-aggregate
          else
            echo 'Unknown build mode'; exit 1
          fi
      - name: Validate source, output, and calibration
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          m = json.loads(pathlib.Path('dataset/fire.json').read_text(encoding='utf-8'))
          mode = os.environ['BUILD_MODE']
          expected = 'sql_sample' if mode == 'smoke' else 'sql'
          assert m['overlap']['source'] == expected, f"Unexpected data source: {m['overlap']['source']}"
          assert m['rows'] > 0
          assert pathlib.Path('dataset/fire.bin').stat().st_size > 0
          assert pathlib.Path('dataset/temp.json').is_file()
          if mode == 'smoke':
              assert not m['overlap']['available'], 'Smoke data must not be calibrated'
          else:
              assert m['overlap'].get('samplePercent', 0) == 0, 'Sample data cannot be deployed'
              assert m['rows'] >= 100_000_000, 'Suspiciously small full dataset; refusing production deployment'
              assert m['overlap']['available'], 'Full dataset has no qualifying shared years; investigate before publishing'
          print('Validated:', expected, 'detections:', m['rows'], 'shared years:', m['overlap']['years'])
          PY
      - name: Upload complete, validated dataset for deployment
        if: env.BUILD_MODE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teraflare-validated-azure-data
          path: |
            dataset/fire.bin
            dataset/fire.json
            dataset/temp.json
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy freshly built Azure data and site to Vercel
    needs: build-azure-data
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the validated Azure dataset
        uses: actions/download-artifact@v4
        with:
          name: teraflare-validated-azure-data
          path: dataset
      - name: Confirm deploying Azure SQL data, not repository fallback
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path('dataset/fire.json').read_text(encoding='utf-8'))
          assert m['overlap']['source'] == 'sql', 'Refusing to deploy non-SQL data'
          assert m['overlap'].get('samplePercent', 0) == 0, 'Refusing to deploy sample'
          assert m['rows'] >= 100_000_000, 'Refusing to deploy incomplete dataset'
          print('Production Azure SQL dataset:', m['rows'], 'detections')
          PY
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check motion.js
          node --check sans.js
      - name: Package website with freshly generated dataset
        run: bash scripts/build-static.sh
      - name: Verify Vercel project IDs
        shell: bash
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
      - name: Install reviewed Vercel CLI
        run: npm install --global vercel@65.16.0
      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Prepare prebuilt Vercel static output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel/output/static
          cp -a public/. .vercel/output/static/
          printf '{"version":3}\n' > .vercel/output/config.json
          test -s .vercel/output/static/index.html
          test -s .vercel/output/static/dataset/fire.bin
          test -s .vercel/output/static/dataset/fire.json
      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
