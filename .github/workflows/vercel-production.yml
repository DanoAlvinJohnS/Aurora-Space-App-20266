name: Deploy FireGlobe to Vercel (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fireglobe-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy main to production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check app.js
          node --check motion.js
          node --check sans.js

      - name: Package static site
        run: bash scripts/build-static.sh

      - name: Verify project IDs
        shell: bash
        run: |
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID secret'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID secret'; exit 1; }

      - name: Install reviewed Vercel CLI
        run: npm install --global vercel@65.16.0

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel production output
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
