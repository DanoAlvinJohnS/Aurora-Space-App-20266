name: Verify TeraFlare preprocess

on:
  push:
    branches: [main, SQL-Integration-, optimize-sql-ci]
    paths:
      - 'preprocess.py'
      - 'sql_aggregate.py'
      - 'count_helpers.py'
      - 'tests/**'
      - '.github/workflows/preprocess-ci.yml'
  pull_request:
    branches: [main, SQL-Integration-]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'numpy>=1.20'
      - name: Syntax check
        run: python -m py_compile preprocess.py sql_aggregate.py count_helpers.py run.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
