<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireGlobe – Burning activity from MODIS and VIIRS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=purple-2">
</head>
<body class="globe-page">
<div id="globe"></div>

<section id="loading" class="glass card center" hidden>
  <h1>Loading fire data</h1>
  <div class="skrow"><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i></div>
  <p id="lmsg">Reading the prepared dataset …</p>
  <div class="progress"><i id="lbar"></i></div>
  <p id="ldetail" class="hint"></p>
</section>

<!-- LEFT: primary navigation and dashboard -->
<aside id="controls" class="glass card side left" hidden>
  <div class="sidebar-head">
    <h1>FireGlobe</h1>
    <a class="about-link" href="about.html">About us</a>
    <button id="collapse" class="collapse" type="button" aria-label="Collapse sidebar" aria-expanded="true">‹</button>
  </div>
  <div class="sidebar-tabs" role="tablist" aria-label="Globe panels">
    <button type="button" role="tab" id="dashboard-tab" aria-controls="dashboard-panel" aria-selected="true">Dashboard</button>
    <button type="button" role="tab" id="settings-tab" aria-controls="settings-panel" aria-selected="false">View settings</button>
  </div>

  <div id="dashboard-panel" class="sidebar-panel" role="tabpanel" aria-labelledby="dashboard-tab">
    <h3>Search by Country</h3>
    <input id="csearch" type="search" placeholder="Search a country" aria-label="Search a country">
    <div id="clist" class="list"></div>
    <section id="timeline" class="glass tl" hidden>
      <button id="play" class="btn">Play</button>
      <input id="year" type="range" aria-label="Year">
      <strong id="yl"></strong>
      <label><input type="checkbox" id="cum" checked> Cumulative</label>
    </section>
    <section id="status" aria-label="Burning activity">
      <h2>Burning activity</h2>
      <p class="big"><span id="count">0</span> <span id="countlabel">detections shown</span></p>
      <p id="meta" class="hint"></p>
      <div class="legend"><span>Rarely burns</span><i></i><span>Burns often</span></div>
      <div id="detail"></div>
    </section>
  </div>

  <div id="settings-panel" class="sidebar-panel" role="tabpanel" aria-labelledby="settings-tab" hidden>
    <fieldset><legend>Map</legend>
      <div class="seg3" id="vseg" role="group" aria-label="Map style">
        <button type="button" data-v="heat" aria-pressed="true">Heat map</button>
        <button type="button" data-v="hex" aria-pressed="false">Hexagon 3D</button>
        <button type="button" data-v="raised" aria-pressed="false">Raised hotspots</button>
      </div>
      <label class="row"><span><input type="checkbox" id="lite"> Low-end mode (lighter graphics)</span></label>
    </fieldset>
    <fieldset><legend>Sensors</legend>
      <label><input type="checkbox" id="modis" checked> MODIS</label>
      <label><input type="checkbox" id="viirs" checked> VIIRS</label>
      <label class="row"><span><input type="checkbox" id="normalize" checked> Normalize VIIRS to MODIS</span></label>
      <p id="normstatus" class="hint" aria-live="polite"></p>
    </fieldset>
    <fieldset><legend>Lighting</legend>
      <div class="seg" role="group" aria-label="Lighting">
        <button type="button" data-mode="day" aria-pressed="false">Day</button>
        <button type="button" data-mode="night" aria-pressed="false">Night</button>
        <button type="button" data-mode="live" aria-pressed="true">Live</button>
      </div>
      <p id="clock" class="hint clock" hidden></p>
      <button id="sunbtn" class="btn ghost small" hidden>Turn to the sun</button>
    </fieldset>
    <h2>Advanced Settings</h2>
    <label class="row">Minimum confidence
      <select id="conf"><option value="0">Any</option><option value="1">Nominal and high</option><option value="2">High only</option></select>
    </label>
    <label class="row">Area size
      <select id="res"><option value="2">Wide (about 110 km)</option><option value="1">Fine (about 55 km)</option></select>
    </label>
  </div>
</aside>
<div id="resize-handle" class="resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0" hidden></div>

<div id="busy" class="glass busy" hidden><i class="spin"></i><span id="busytxt"></span></div>
<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
<script type="module" src="app.js"></script>
<script src="sans.js"></script>
</body>
</html>
