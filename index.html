<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireGlobe – Burning activity from MODIS and VIIRS</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="globe-page">
<nav class="glass nav">
  <a class="brand" href="index.html">FireGlobe</a>
  <div><a class="active" href="index.html">Globe</a><a href="about.html">About us</a></div>
</nav>

<div id="globe"></div>

<section id="loading" class="glass card center" hidden>
  <h1>Loading fire data</h1>
  <p id="lmsg">Reading the prepared dataset …</p>
  <div class="progress"><i id="lbar"></i></div>
  <p id="ldetail" class="hint"></p>
</section>

<!-- LEFT: status, data and graphs -->
<aside id="status" class="glass card side left" hidden>
  <h2>Burning activity</h2>
  <p class="big"><span id="count">0</span> detections shown</p>
  <p id="meta" class="hint"></p>
  <div class="legend"><span>Rarely burns</span><i></i><span>Burns often</span></div>
  <div id="detail"></div>
</aside>

<!-- RIGHT: options slide-bar -->
<aside id="controls" class="glass card side right" hidden>
  <h2>Options</h2>
  <fieldset><legend>Lighting</legend>
    <div class="seg" role="group" aria-label="Lighting">
      <button type="button" data-mode="day" aria-pressed="false">Day</button>
      <button type="button" data-mode="night" aria-pressed="false">Night</button>
      <button type="button" data-mode="live" aria-pressed="true">Live</button>
    </div>
    <p id="clock" class="hint clock" hidden></p>
    <button id="sunbtn" class="btn ghost small" hidden>Turn to the sun</button>
  </fieldset>
  <fieldset><legend>Map</legend>
    <div class="seg2" id="vseg"><button type="button" data-v="heat" aria-pressed="true">Heat map</button><button type="button" data-v="hex" aria-pressed="false">Hexagon 3D</button></div>
    <label class="row"><span><input type="checkbox" id="lite"> Low-end mode (lighter graphics)</span></label>
  </fieldset>
  <fieldset><legend>Sensors</legend>
    <label><input type="checkbox" id="modis" checked> MODIS</label>
    <label><input type="checkbox" id="viirs" checked> VIIRS</label>
  </fieldset>
  <label class="row">Minimum confidence
    <select id="conf"><option value="0">Any</option><option value="1">Nominal and high</option><option value="2">High only</option></select>
  </label>
  <label class="row">Area size
    <select id="res"><option value="2">Wide (about 110 km)</option><option value="1">Fine (about 55 km)</option></select>
  </label>
  <h3>Countries</h3>
  <input id="csearch" type="search" placeholder="Search a country" aria-label="Search a country">
  <div id="clist" class="list"></div>
</aside>

<section id="timeline" class="glass tl" hidden>
  <button id="play" class="btn">Play</button>
  <input id="year" type="range" aria-label="Year">
  <strong id="yl"></strong>
  <label><input type="checkbox" id="cum" checked> Cumulative</label>
</section>

<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
<script type="module" src="app.js"></script>
</body>
</html>
